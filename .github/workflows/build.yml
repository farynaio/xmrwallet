name: Build Monerujo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-native-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls in external-libs/monero etc.

      - name: Setup monero symlink
        run: |
          cd external-libs
          # Remove the submodule checkout (regular directory)
          rm -rf monero
          # Clone the monero fork the project expects
          git clone --depth 1 --branch release-v0.18.3.4-monerujo \
            https://github.com/m2049r/monero.git /tmp/monero
          # Create the symlink the Makefile requires
          ln -s /tmp/monero monero

      # The external-libs/Makefile handles NDK + dependency builds per ABI.
      # It expects Android NDK and build-essential to be present.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake tofrodos libtool-bin

      - name: Build native libraries
        working-directory: external-libs
        run: make

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: external-libs
          path: external-libs/

  build-apk:
    runs-on: ubuntu-latest
    needs: build-native-libs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: external-libs
          path: external-libs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create monerujo.id
        run: |
          # SideShift.ai API key for swapping
          echo "ID_A=" > monerujo.id

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/debug/